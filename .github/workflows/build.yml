name: Build TWRP L751
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 8192
          build-mount-path: '/mnt/twrp'
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 repo
      - name: Sync TWRP 12.1
        run: |
          cd /mnt/twrp
          git config --global user.name "builder"
          git config --global user.email "builder@localhost"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -j$(nproc) --force-sync --no-clone-bundle --no-tags
      - name: Copy Device Tree
        uses: actions/checkout@v4
        with:
          path: twrp_device_tree
      - name: Build Recovery
        run: |
          mkdir -p /mnt/twrp/device/crosscall/L751
          cp -r twrp_device_tree/* /mnt/twrp/device/crosscall/L751/
          cd /mnt/twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch twrp_L751-eng
          mka recoveryimage -j$(nproc)
      - name: Upload recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-L751
          path: /mnt/twrp/out/target/product/L751/recovery.img
